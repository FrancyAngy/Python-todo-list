[project]
name = "ToDo_client"
version = "0.1.0"
description = "A python To-Do list written in python"
readme = "README.md"
authors = [{ name = "FrancyAngy", email = "francy.angy009@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "sqlalchemy>=2.1.4",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]

[project.scripts]
client = "todo_client:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
